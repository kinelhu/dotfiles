# Pandoc defaults — Beamer slides (style Kinan)
# Usage : pandoc input.md --defaults slides-kinan -o output-slides.pdf
# Ou via wrapper : mdslides input.md

to: beamer
pdf-engine: xelatex
slide-level: 2
variables:
  classoption: "aspectratio=169"
  fontsize: "11pt"
  section-titles: false   # désactivé : beamer-header.tex gère \AtBeginSection
include-in-header:
  - /Users/kinelhu/.local/share/pandoc/templates/beamer-header.tex
filters:
  - /Users/kinelhu/.local/share/pandoc/filters/beamer-blocks.lua
