# Pandoc defaults — Livre / essai littéraire (style Kinan)
# Usage : pandoc input.md --defaults book-kinan -o output.pdf
#
# Requires LuaLaTeX (not xelatex): luaotfload finds EB Garamond directly in
# the TeX Live tree, no font-install step needed.
#
# Chapter headings must all sit at the SAME markdown level (## recommended),
# with any numbering (e.g. "II. Le socle") typed into the heading text itself
# — the template does not auto-number chapters. Use
# --shift-heading-level-by=-1 if your source chapters are at level 2.

pdf-engine: lualatex
template: /Users/kinelhu/.local/share/pandoc/templates/book-template.tex
filters:
  - /Users/kinelhu/.local/share/pandoc/filters/respiration.lua
toc: true
toc-depth: 1
top-level-division: chapter
shift-heading-level-by: -1
