title: Kinan House Style
author: Kinan El Husseini
version: 1.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme:
        - simple
        - theme-kinan.scss
      progress: true
      slide-number: c/t
      width: 1600
      height: 900
    html:
      theme:
        - cosmo
        - kinan-report.scss
      toc: true
      toc-depth: 3
    pdf:
      template: /Users/kinelhu/.dotfiles/pandoc/templates/stats-report-template.tex
      pdf-engine: xelatex
      toc: true
      filters:
        - table-header-font.lua
        - table-zebra.lua
